services:
  - type: web
    name: ruralbus-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install && pnpm build
    startCommand: pnpm api:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
